<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Chuche Envenenada</title>
<link rel="stylesheet" href="styles.css?v=3">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <h1>🍬 Chuche Envenenada</h1>
  </div>
  <div class="settings-cluster">
    <select id="musicTrack" title="Pista de música"></select>
    <button id="btnMusic" class="icon-btn">🔇</button>
  </div>
</div>

<div class="screen" id="screen-menu">
  <div class="card">
    <button id="btnLocal">🎮 Jugar en este dispositivo</button>
    <button id="btnCreateRoom" style="margin-top:0.6rem;">🌐 Crear sala online</button>
    <button id="btnJoinRoom" class="secondary" style="margin-top:0.6rem;">🔑 Unirse a una sala</button>
  </div>
</div>

<div class="screen hidden" id="screen-name">
  <div class="card">
    <label class="field-label">Nombre</label>
    <input type="text" id="myName" placeholder="Tu nombre" maxlength="16">
    <button id="btnNameContinue" style="margin-top:1rem;">Continuar</button>
    <button class="secondary" id="btnNameBack" style="margin-top:0.5rem;">Volver</button>
  </div>
  <div class="msg" id="nameMsg"></div>
</div>

<div class="screen hidden" id="screen-local-setup">
  <div class="card">
    <label class="field-label">Número de jugadores (2-5)</label>
    <input type="number" id="localCount" min="2" max="5" value="2">
    <div class="name-list" id="localNames" style="margin-top:0.8rem;"></div>
    <button id="btnLocalContinue" style="margin-top:1rem;">Continuar</button>
    <button class="secondary" id="btnLocalBack" style="margin-top:0.5rem;">Volver</button>
  </div>
</div>

<div class="screen hidden" id="screen-join">
  <div class="card">
    <label class="field-label">Código de sala</label>
    <input type="text" id="joinCode" placeholder="Ej: FOX42" maxlength="8" style="text-transform:uppercase;">
    <button id="btnDoJoin" style="margin-top:1rem;">Unirse</button>
    <button class="secondary" id="btnJoinBack" style="margin-top:0.5rem;">Volver</button>
  </div>
  <div class="msg" id="joinMsg"></div>
</div>

<div class="screen hidden" id="screen-lobby">
  <div class="card center">
    <div class="msg">Código de sala</div>
    <div id="roomCodeDisplay">----</div>
  </div>
  <div class="card">
    <div class="msg" style="margin-bottom:0.5rem;">Jugadores conectados</div>
    <div class="players-box" id="lobbyPlayers"></div>
  </div>
  <button id="btnStartOnline" class="hidden">Empezar partida</button>
  <button id="btnLobbyLeave" class="secondary">Abandonar sala</button>
  <div class="msg" id="lobbyMsg">Esperando al anfitrión...</div>
</div>

<div class="screen hidden" id="screen-config">
  <div class="card">
    <b>⚙️ Configuración de la sala</b>
    <div class="config-grid" style="margin-top:0.8rem;">
      <div class="config-item full">
        <label class="field-label">Tablero (filas × columnas, 2-10)</label>
        <div class="row">
          <input type="number" id="cfgRows" min="2" max="10">
          <input type="number" id="cfgCols" min="2" max="10">
        </div>
      </div>
      <div class="config-item">
        <label class="field-label">Comodines máx. por jugador</label>
        <input type="number" id="cfgMaxWildcards" min="0" max="15">
      </div>
      <div class="config-item">
        <label class="field-label">Stock de cada comodín</label>
        <input type="number" id="cfgStock" min="1" max="9">
      </div>
      <div class="config-item">
        <label class="field-label">Tiempo para actuar</label>
        <select id="cfgActionTime"></select>
      </div>
      <div class="config-item">
        <label class="field-label">Tiempo para elegir veneno</label>
        <select id="cfgPoisonTime"></select>
      </div>
      <div class="config-item">
        <label class="field-label">Chuches envenenadas / jugador</label>
        <input type="number" id="cfgPoisonCount" min="1" max="9">
      </div>
      <div class="config-item">
        <label class="field-label">Vidas por jugador</label>
        <input type="number" id="cfgLives" min="1" max="5">
      </div>
      <div class="config-item full">
        <label class="field-label">Estilo de la chuchería <span class="skin-preview" id="skinPreview">🧸</span></label>
        <select id="cfgSkin"></select>
      </div>
      <div class="config-item full toggle-row">
        <span>Comodines al azar (sin tienda)</span>
        <input type="checkbox" id="cfgRandom">
      </div>
    </div>
    <button id="btnConfigContinue" style="margin-top:1rem;">Empezar partida</button>
    <button class="secondary" id="btnConfigBack" style="margin-top:0.5rem;">Volver</button>
  </div>
</div>

<div class="screen hidden" id="screen-shop">
  <div class="card center" id="shopHeader">Elige un comodín</div>
  <div class="msg" id="shopTimer" style="font-size:1.1rem; font-weight:700; color:var(--neon);"></div>
  <div class="card" id="shopShelves"></div>
  <div class="card" id="shopInventories"></div>
</div>

<div class="screen hidden" id="screen-poison">
  <div class="card center">
    <div id="poisonPrompt" style="font-weight:600; margin-bottom:0.3rem;"></div>
    <div class="msg" id="poisonTimer"></div>
  </div>
  <div class="board" id="poisonBoard"></div>
</div>

<div class="screen hidden" id="screen-wheel">
  <div class="wheel-wrap">
    <div class="msg">Girando...</div>
    <div class="wheel-name" id="wheelName">?</div>
  </div>
</div>

<div class="screen hidden" id="screen-game">
  <div class="turn-banner" id="turnBanner">Turno de ...</div>
  <button id="btnGameLeave" class="secondary small hidden" style="align-self:center;">Abandonar partida</button>
  <div class="game-layout">
    <div class="side-panel" id="otherInventoriesWrap">
      <b style="font-size:0.85rem;">Comodines</b>
      <div id="otherInventories"></div>
    </div>
    <div class="board" id="gameBoard"></div>
    <div class="side-panel" id="myActionsWrap">
      <b style="font-size:0.85rem;">Tus comodines</b>
      <div id="myActions"></div>
    </div>
  </div>
  <div class="card hidden" id="defenseBox"></div>
  <div class="uimode-bar hidden" id="uiModeBar"></div>
  <div class="msg" id="gameMsg"></div>
  <div class="msg" id="equilibrioLogBox"></div>
</div>

<div class="screen hidden" id="screen-result">
  <div class="card result-box" id="resultBox">
    <div class="big-emoji" id="resultEmoji">🏆</div>
    <div id="resultBanner" class="result-win-banner">Has ganado</div>
    <div class="msg" id="resultSub"></div>
    <div class="msg" id="resultRanking"></div>
  </div>
  <button id="btnReplay">Volver al menú</button>
</div>

<div class="modal-overlay hidden" id="actionModal">
  <div class="modal-box">
    <div id="modalTitle" style="font-weight:700;"></div>
    <div class="modal-list" id="modalList"></div>
    <button class="secondary small" id="btnModalCancel">Cancelar</button>
  </div>
</div>

<script src="app.js?v=3"></script>
</body>
</html>
